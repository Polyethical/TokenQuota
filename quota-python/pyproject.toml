[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tokenquota"
version = "0.1.0"
description = "Per-user token and dollar budgets for AI apps, enforced before the model call."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "YOUR NAME" }]
keywords = ["llm", "quota", "rate-limit", "openai", "anthropic", "billing", "usage-limits"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5"]
dev = ["pytest>=8", "redis>=5"]

[project.urls]
Homepage = "https://YOUR-DOMAIN"
Documentation = "https://github.com/YOUR-ORG/quota-python#readme"
Source = "https://github.com/YOUR-ORG/quota-python"
Issues = "https://github.com/YOUR-ORG/quota-python/issues"
Changelog = "https://github.com/YOUR-ORG/quota-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenquota"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --import-mode=importlib"
